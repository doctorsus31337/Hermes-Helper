name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install GUI runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-gi gir1.2-ayatanaappindicator3-0.1 xvfb xauth
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: python3 -m compileall -q launcher.py hermes_control scripts tests
      - name: Check shell scripts
        run: bash -n install.sh uninstall.sh
      - name: Build and verify release upgrade
        run: |
          python3 scripts/build_release.py
          python3 scripts/verify_release_upgrade.py
      - name: Headless GUI smoke test
        run: timeout 8s xvfb-run -a python3 launcher.py || test $? -eq 124
